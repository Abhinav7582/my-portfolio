version: 2
updates:
  # Keeps npm dependencies patched without you having to remember to check.
  # Grouped so you get one PR a week rather than a dozen.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
